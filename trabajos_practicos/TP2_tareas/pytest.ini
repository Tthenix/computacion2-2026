[pytest]
# Los tests importan los módulos directo (from main import app), como si
# estuvieran parados en src/ y mediciones/.
pythonpath = src mediciones
testpaths = tests
# Starlette avisa que TestClient migrará de httpx a httpx2. No nos afecta:
# las versiones están fijadas en requirements.txt.
filterwarnings =
    ignore:Using .httpx. with .starlette.testclient.
# Los tests/fixtures `async def` se corren solos, sin @pytest.mark.asyncio.
asyncio_mode = auto

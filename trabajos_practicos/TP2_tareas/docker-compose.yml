services:
  # La plataforma de tareas: API FastAPI + cola + workers.
  api:
    build: .
    environment:
      WORKERS: "2"      # corrutinas worker que sacan tareas de la cola
      COLA_MAX: "100"   # tareas esperando como máximo; más → 503
      TIMEOUT_DEFAULT: "60"  # segundos; una tarea sin `timeout` propio usa este
    ports:
      - "8000:8000"

  # Servidor de pruebas: GET /lento?seg=N responde después de N segundos.
  # Es un "internet lento" controlado contra el que descargan la tarea
  # `descargar` y la medición 1, así los números son reproducibles.
  lento:
    build: .
    command: ["uvicorn", "servidor_lento:app", "--app-dir", "mediciones", "--host", "0.0.0.0", "--port", "8001"]
    ports:
      - "8001:8001"
